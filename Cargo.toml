[package]
name = "db_api"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
postgres = "0.19.12"
tiny_http = "0.12.0"
warp = "0.3"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
chrono = "0.4.42"
migration_macro = { path = "migration_macro" }
